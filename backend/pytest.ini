[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = apps tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:jazzmin.*
markers =
    guarantee_limit: switch the 2x guarantee limit (BR-31) on for this test
    borrowing_limit: switch the 3x society-wide borrowing limit (BR-32) on for this test
