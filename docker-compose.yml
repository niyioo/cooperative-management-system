# Local development stack. Copy .env.example to .env first and set DB_PASSWORD.
# (For production, run the backend image with DEBUG=False and real secrets; see README.)
services:
  db:
    image: postgres:15-alpine
    container_name: bravedge_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-cooperative_db}
      POSTGRES_USER: ${DB_USER:-coop_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coop_user} -d ${DB_NAME:-cooperative_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: bravedge_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: ${DB_NAME:-cooperative_db}
      DB_USER: ${DB_USER:-coop_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_COOKIE_SECURE: "False"   # plain http on localhost
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bravedge_frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
