# The app at /, and the backend's paths passed on to Django.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Monthly spreadsheets and loan documents.
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/(api|django-admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Built files carry a hash in their names, so they can be kept for long. (expires,
    # not add_header, so the headers above still apply here.)
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
