# Office installation: the whole system on one computer, opened in a browser by
# anyone on the office network. See README.md in this folder.
#
#   web      nginx: the built app, and /api passed on to the backend (the only open port)
#   backend  Django under gunicorn
#   db       PostgreSQL, reachable only by the backend
#
# Settings and secrets come from .env next to this file (setup.ps1 writes it).
name: emdi-office

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-emdi_coop}
      POSTGRES_USER: ${DB_USER:-emdi_coop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup.ps1 first}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-emdi_coop} -d ${DB_NAME:-emdi_coop}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../../backend
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.office
      SECRET_KEY: ${SECRET_KEY:?Run setup.ps1 first}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${SITE_ORIGINS:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${SITE_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost/#}
      DB_NAME: ${DB_NAME:-emdi_coop}
      DB_USER: ${DB_USER:-emdi_coop}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_SCHEMA: ${DB_SCHEMA:-}
      MEDIA_ROOT: /app/media
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-EMDI Cooperative <no-reply@localhost>}
      WEB_CONCURRENCY: "3"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../frontend
      dockerfile: ../deploy/office/web.Dockerfile
      additional_contexts:
        office: .
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
  media:
