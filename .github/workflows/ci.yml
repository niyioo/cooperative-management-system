name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emdi_coop
          POSTGRES_USER: emdi_coop
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emdi_coop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: emdi_coop
      DB_USER: emdi_coop
      DB_PASSWORD: ci_only_password
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - name: Production settings pass Django's deploy checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: api.example.org
      - name: API schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - name: Tests
        run: pytest --cov=apps --cov-report=term --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
